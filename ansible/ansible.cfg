[defaults]
inventory = hosts.ini
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
roles_path = ./roles

# Show task timing — helps spot slow tasks
callbacks_enabled = timer, profile_tasks

# Faster SSH connections — reuse connections across tasks
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
